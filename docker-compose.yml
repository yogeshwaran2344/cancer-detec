version: "3.8"

services:
  # 1. PostgreSQL Database Service
  postgres-db:
    image: postgres:16-alpine
    container_name: pathoguard-db
    restart: always
    environment:
      POSTGRES_DB: pathoguard_prod
      POSTGRES_USER: pathoguard_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecurePathoGuardProdPass2026!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathoguard_user -d pathoguard_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pathoguard-internal

  # 2. PathoGuard-AI FastAPI Backend Service
  backend-api:
    build:
      context: ./PathoGuard-AI-Backend
      dockerfile: Dockerfile
    container_name: pathoguard-backend
    restart: always
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      DATABASE_URL: postgresql://pathoguard_user:${DB_PASSWORD:-SecurePathoGuardProdPass2026!}@postgres-db:5432/pathoguard_prod
      ALLOWED_ORIGINS: '["https://pathoguard.local", "http://localhost"]'
      UPLOAD_SANDBOX_PATH: /var/data/pathoguard/sandbox
    volumes:
      - sandbox_storage:/var/data/pathoguard/sandbox
    expose:
      - "8000"
    networks:
      - pathoguard-internal

  # 3. Frontend Web Service with Nginx Reverse Proxy
  frontend-web:
    image: nginx:alpine
    container_name: pathoguard-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./PathoGuard-AI-Frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-api
    networks:
      - pathoguard-internal

volumes:
  pgdata:
  sandbox_storage:

networks:
  pathoguard-internal:
    driver: bridge
